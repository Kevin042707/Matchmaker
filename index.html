<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Matchmaker 2.0</title>
  <style>
    :root {
      --bg: #f5f6fa;
      --card: #ffffff;
      --text: #222;
      --muted: #666;
      --accent: #ff6b6b;
      --border: #e3e7ee;
      --mono: 'Courier New', Courier, monospace;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--text);
      font-family: "Inter", system-ui, sans-serif;
      padding: 20px;
    }

    .card {
      width: 900px;
      max-width: 95vw;
      background: var(--card);
      border-radius: 10px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      padding: 24px;
      border: 1px solid var(--border);
    }

    pre.terminal {
      background: #f1f3f8;
      padding: 14px;
      border-radius: 6px;
      font-family: var(--mono);
      color: var(--muted);
      white-space: pre-wrap;
      word-break: break-word;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0 0 10px 0;
      font-size: 22px;
      color: var(--accent);
      text-align: center;
    }

    .interactive {
      display: grid;
      grid-template-columns: 1fr 300px;
      gap: 18px;
      align-items: start;
    }

    .questions {
      background: #fafbff;
      padding: 16px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .q {
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px dashed var(--border);
    }

    .q:last-child {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }

    label.question-title {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--text);
      font-size: 14px;
    }

    .choices {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .choice {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 6px;
      border-radius: 6px;
      background: #fff;
      cursor: pointer;
      border: 1px solid var(--border);
      font-family: var(--mono);
    }

    .choice:hover {
      background: #ffeaea;
      border-color: var(--accent);
    }

    .result {
      padding: 16px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #fdfdfd;
      min-height: 180px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      white-space: pre-line;
    }

    .big-score {
      font-family: var(--mono);
      font-size: 28px;
      letter-spacing: 0.02em;
      color: var(--accent);
    }

    .tiny {
      color: var(--muted);
      font-size: 13px;
    }

    .btn {
      display: inline-block;
      padding: 8px 14px;
      border-radius: 8px;
      background: var(--accent);
      color: white;
      border: none;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      transition: background 0.2s;
    }

    .btn:hover {
      background: #ff5252;
    }

    .btn.secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }

    .btn.secondary:hover {
      background: #f5f6fa;
    }

    @media (max-width:880px){
      .interactive {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <!-- your original HTML + script remains exactly the same -->
  <!-- (everything below is unchanged except for visuals) -->
  <div class="card" role="main">
    <h1>Matchmaker 2.0 — Love evolved</h1>
    <pre class="terminal">
This program figures out if you and I are a match.
You will answer 5 questions. To each question:
5 = strongly agree
4 = agree
3 = neutral
2 = disagree
1 = strongly disagree
    </pre>

    <div class="interactive">
      <div class="questions" id="quiz">
        <div class="q"><label class="question-title">Question 1 — Breaking Bad is the greatest show of all time</label>
          <div class="choices">
            <label class="choice"><input type="radio" name="q1" value="5">5</label>
            <label class="choice"><input type="radio" name="q1" value="4">4</label>
            <label class="choice"><input type="radio" name="q1" value="3">3</label>
            <label class="choice"><input type="radio" name="q1" value="2">2</label>
            <label class="choice"><input type="radio" name="q1" value="1">1</label>
          </div>
        </div>

        <div class="q"><label class="question-title">Question 2 — MMA is the best sport in the world</label>
          <div class="choices">
            <label class="choice"><input type="radio" name="q2" value="5">5</label>
            <label class="choice"><input type="radio" name="q2" value="4">4</label>
            <label class="choice"><input type="radio" name="q2" value="3">3</label>
            <label class="choice"><input type="radio" name="q2" value="2">2</label>
            <label class="choice"><input type="radio" name="q2" value="1">1</label>
          </div>
        </div>

        <div class="q"><label class="question-title">Question 3 — Tacos are better than pizza</label>
          <div class="choices">
            <label class="choice"><input type="radio" name="q3" value="5">5</label>
            <label class="choice"><input type="radio" name="q3" value="4">4</label>
            <label class="choice"><input type="radio" name="q3" value="3">3</label>
            <label class="choice"><input type="radio" name="q3" value="2">2</label>
            <label class="choice"><input type="radio" name="q3" value="1">1</label>
          </div>
        </div>

        <div class="q"><label class="question-title">Question 4 — Superman is one of the best movies of 2025</label>
          <div class="choices">
            <label class="choice"><input type="radio" name="q4" value="5">5</label>
            <label class="choice"><input type="radio" name="q4" value="4">4</label>
            <label class="choice"><input type="radio" name="q4" value="3">3</label>
            <label class="choice"><input type="radio" name="q4" value="2">2</label>
            <label class="choice"><input type="radio" name="q4" value="1">1</label>
          </div>
        </div>

        <div class="q"><label class="question-title">Question 5 — Xbox is a better console than Playstation</label>
          <div class="choices">
            <label class="choice"><input type="radio" name="q5" value="5">5</label>
            <label class="choice"><input type="radio" name="q5" value="4">4</label>
            <label class="choice"><input type="radio" name="q5" value="3">3</label>
            <label class="choice"><input type="radio" name="q5" value="2">2</label>
            <label class="choice"><input type="radio" name="q5" value="1">1</label>
          </div>
        </div>

        <div style="margin-top:12px;">
          <button class="btn" id="calcBtn">Calculate score</button>
          <button class="btn secondary" id="resetBtn" type="button">Reset</button>
        </div>
      </div>

      <aside class="result" aria-live="polite">
        <div class="tiny">Results</div>
        <div class="big-score" id="scoreDisplay">Your score: —</div>
        <div id="matchMsg" class="tiny">Answer the questions and press <strong>Calculate score</strong>.</div>
        <div style="margin-top:10px;">
          <button class="btn" id="suggestBtn">Want to grab food?</button>
        </div>
      </aside>
    </div>
  </div>

<script>
  /* your JavaScript stays exactly the same */
  const TOTAL_QUESTIONS = 5;
  const MAX_SCORE = 100;
  const MIN_SCORE = 0;
  const HIGHLIGHT_COLOR = 'var(--accent)';
  const DEFAULT_BORDER = 'var(--border)';

  const calcBtn = document.getElementById('calcBtn');
  const resetBtn = document.getElementById('resetBtn');
  const scoreDisplay = document.getElementById('scoreDisplay');
  const matchMsg = document.getElementById('matchMsg');
  const suggestBtn = document.getElementById('suggestBtn');

  function validate() {
    let allAnswered = true;
    let firstUnanswered = null;
    document.querySelectorAll('.q').forEach(q => q.style.borderColor = DEFAULT_BORDER);

    for (let i = 1; i <= TOTAL_QUESTIONS; i++) {
      const qBlock = document.querySelector(`.q:nth-of-type(${i})`);
      const selected = document.querySelector(`input[name="q${i}"]:checked`);
      if (!selected) {
        qBlock.style.borderColor = HIGHLIGHT_COLOR;
        if (!firstUnanswered) firstUnanswered = qBlock;
        allAnswered = false;
      }
    }

    if (!allAnswered) {
      firstUnanswered.scrollIntoView({ behavior: "smooth", block: "center" });
      return { valid: false, message: "Please answer all highlighted questions before proceeding." };
    }
    return { valid: true };
  }

  function computeScore() {
    const validation = validate();
    if (!validation.valid) return validation;

    const answers = [];
    for (let i = 1; i <= TOTAL_QUESTIONS; i++) {
      const val = parseInt(document.querySelector(`input[name="q${i}"]:checked`).value, 10);
      answers.push(val);
    }

    const sum = answers.reduce((a, b) => a + b, 0);
    const scaled = Math.min(MAX_SCORE, Math.round(((sum - TOTAL_QUESTIONS) / (TOTAL_QUESTIONS * 4)) * 100));
    return { ok: true, sum, scaled, answers };
  }

  calcBtn.addEventListener('click', () => {
    const r = computeScore();
    if (!r.ok) {
      scoreDisplay.textContent = "Your score: —";
      matchMsg.textContent = r.message;
      return;
    }

    scoreDisplay.textContent = "Your score: " + r.scaled + "%";

    let remark = "";
    if (r.scaled >= 90) {
      remark = "We agree on a lot of things, lets go get some food";
    } else if (r.scaled >= 60) {
      remark = "Not bad, we should get some food and talk over it";
    } else {
      remark = "We might disagree on a few things, but lets go get some food anyway";
    }

    const summary = r.answers
      .map((val, i) => `Question ${i + 1}: ${val}/5`)
      .join('\n');

    matchMsg.textContent = `${summary}\n\nOverall Compatibility: ${r.scaled}%\n${remark}`;
  });

  resetBtn.addEventListener('click', () => {
    document.querySelectorAll('input[type=radio]').forEach(i => i.checked = false);
    document.querySelectorAll('.q').forEach(q => q.style.borderColor = DEFAULT_BORDER);
    scoreDisplay.textContent = "Your score: —";
    matchMsg.textContent = "Answer the questions and press Calculate score.";
  });

  suggestBtn.addEventListener('click', () => {
    alert("Let's go grab some Raising Canes.");
  });
</script>
</body>
</html>
